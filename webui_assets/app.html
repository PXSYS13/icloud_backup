<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>iCloud БК</title>
<script>
  // Тема — до отрисовки, чтобы не мигало: сохранённый выбор, иначе тёмная
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('icloud-theme'); } catch (e) { /* приватный режим */ }
    if (theme !== 'light' && theme !== 'dark') theme = 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/static/app.css?v=__APP_VERSION__">
<script defer src="/static/js/core.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/components.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/screens/home.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/screens/prepare.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/screens/login.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/screens/process.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/screens/yandex.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/screens/done.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/screens/help.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/screens/support.js?v=__APP_VERSION__"></script>
<script defer src="/static/js/main.js?v=__APP_VERSION__"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/home" aria-label="На главную">
      <span class="brand-logo" data-icon="cloud-down"></span>
      <span class="brand-text">
        <span class="brand-name">iCloud БК</span>
        <span class="brand-sub" id="brand-version">версия __APP_VERSION__</span>
      </span>
    </a>

    <nav class="nav" id="tabs" aria-label="Разделы">
      <a href="#/home" data-route="home"><span class="ico" data-icon="home"></span><span>Главная</span></a>
      <a href="#/process" data-route="process"><span class="ico" data-icon="sliders"></span><span>Обработка</span></a>
      <a href="#/yandex" data-route="yandex"><span class="ico" data-icon="cloud"></span><span>Яндекс Диск</span></a>
      <a href="#/help" data-route="help"><span class="ico" data-icon="help"></span><span>Помощь</span></a>
      <a href="#/support" data-route="support"><span class="ico" data-icon="heart"></span><span>Поддержать</span></a>
    </nav>

    <div class="side-block">
      <div class="side-title">Подключения</div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="side-foot">
      <button type="button" class="theme-toggle" data-action="theme-toggle" id="theme-toggle" aria-label="Сменить тему">Тема</button>
      <div class="side-links">
        <a id="footer-telegram" href="https://t.me/davronsv" target="_blank" rel="noopener">Telegram</a>
        <a id="footer-github" href="https://github.com/PXSYS13/icloud_backup" target="_blank" rel="noopener">GitHub</a>
      </div>
      <span class="tiny" id="footer-text">iCloud БК</span>
    </div>
  </aside>

  <main class="main">
    <section id="screen-home" class="screen hidden"></section>
    <section id="screen-prepare" class="screen hidden"></section>
    <section id="screen-login" class="screen hidden"></section>
    <section id="screen-process" class="screen hidden"></section>
    <section id="screen-yandex" class="screen hidden"></section>
    <section id="screen-done" class="screen hidden"></section>
    <section id="screen-help" class="screen hidden"></section>
    <section id="screen-support" class="screen hidden"></section>
    <footer class="main-foot">
      <a href="https://t.me/davronsv" target="_blank" rel="noopener">Telegram</a>
      <a href="https://github.com/PXSYS13/icloud_backup" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </main>
</div>
<div id="dialog-root"></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<noscript>Для работы программы нужен JavaScript.</noscript>
</body>
</html>
