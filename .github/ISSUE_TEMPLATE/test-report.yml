name: Отчёт о тестировании
description: Расскажите, как прошло скачивание — даже если всё получилось. Это займёт пять минут.
title: "Тест: "
labels: ["тестирование"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что проверяете программу. Каждый отзыв помогает найти ошибки, которые на одном компьютере не видны. «Всё скачалось, число сошлось» — тоже ценный отзыв.

        **Этот отзыв увидят все.** Не пишите сюда пароль, коды подтверждения и полный Apple ID и не прикладывайте личные фото. Для помощи они не нужны.

        Пошаговая инструкция — [INSTRUCTION.md](https://github.com/PXSYS13/icloud_backup/blob/main/INSTRUCTION.md).

  - type: dropdown
    id: result
    attributes:
      label: Чем закончилось
      options:
        - Всё скачалось, число фото и видео сошлось с айфоном
        - Всё скачалось, но число не сошлось
        - Скачалась только часть
        - Не получилось войти в Apple ID
        - Программа не запустилась
        - Ещё качается — пишу, что уже видно
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Система на компьютере
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Другая
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия программы
      description: Написана в меню слева под названием «iCloud БК», например «версия 1.0.2».
      placeholder: "1.0.2"

  - type: input
    id: ios
    attributes:
      label: Версия iOS на айфоне
      description: На айфоне — «Настройки» → «Основные» → «Об этом устройстве».
      placeholder: "iOS 26.4"

  - type: input
    id: library
    attributes:
      label: Размер медиатеки
      description: Сколько фото и видео показывает программа и сколько это ГБ. Если помните — сколько показывает айфон в самом низу «Медиатеки».
      placeholder: "В программе 12 000 фото, 800 видео, 95 ГБ; на айфоне 12 004 фото, 800 видео"

  - type: input
    id: duration
    attributes:
      label: Сколько заняло скачивание
      placeholder: "около 6 часов"

  - type: checkboxes
    id: checked
    attributes:
      label: Что успели проверить
      description: Отметьте то, что пробовали, — и то, что сработало, и то, что нет.
      options:
        - label: Подготовка айфона по подсказкам программы
        - label: Вход в Apple ID и код подтверждения
        - label: «Проверить медиатеку» — число фото и видео
        - label: Скачивание
        - label: «Пауза» и «Продолжить»
        - label: Продолжение после закрытия окна или перезагрузки компьютера
        - label: JPG-копии из HEIC
        - label: Поиск одинаковых файлов
        - label: Раскладка по годам и месяцам
        - label: Копия в Яндекс Диск

  - type: textarea
    id: problems
    attributes:
      label: Что пошло не так
      description: По шагам — что нажали, что ожидали, что увидели. Текст сообщения программы лучше скопировать целиком. Скриншот можно вставить сюда.
      placeholder: |
        После «Скачать всё» через час пишет «Жду Apple» и дальше не качает.

  - type: textarea
    id: unclear
    attributes:
      label: Что было непонятно или неудобно
      description: Где пришлось думать, искать или угадывать. Какое слово в программе непонятно.

  - type: textarea
    id: report
    attributes:
      label: Отчёт для поддержки
      description: |
        В программе «Помощь» → «Скачать отчёт для поддержки». Перетащите ZIP-файл в это поле.
        В отчёте нет пароля, кодов и ключей, Apple ID записан не полностью. Но в нём есть путь к папке с фото (в нём может быть имя пользователя компьютера) и имена файлов вроде IMG_0001.HEIC. Не хотите показывать это всем — пришлите отчёт в Telegram @davronsv.

  - type: checkboxes
    id: privacy
    attributes:
      label: Проверьте перед отправкой
      options:
        - label: Здесь нет пароля, кодов подтверждения и полного Apple ID
          required: true
