[project]
name = "icloud-backup"
version = "1.0.0"
description = "Бесплатная программа, которая скачивает всю медиатеку iCloud Фото на компьютер и, по желанию, в Яндекс Диск"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.2.3",
    "requests>=2.31.0",
    "yadisk[sync_defaults]>=3.4.0",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    # icloudpd 1.32.3, чистый Python-wheel. Платформенные wheel на PyPI — бинарники
    # PyInstaller, их нельзя импортировать, поэтому ссылка на конкретный файл
    "icloudpd @ https://files.pythonhosted.org/packages/b9/73/20544e68569fce262d596ebe42730aac235b8e69a36edefebdf8cfa85508/icloudpd-1.32.3-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:state",
    "error::DeprecationWarning:utils",
    "error::DeprecationWarning:webapp",
    "error::EncodingWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["_reference", "_demo_cloud"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
